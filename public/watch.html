<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video - VideoVerse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <span>VideoVerse</span>
    </a>

    <div class="nav-search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search videos...">
    </div>

    <div class="nav-actions">
      <button class="btn-upload" onclick="window.location.href='/?upload=1'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Upload Video</span>
      </button>
    </div>
  </header>

  <!-- WATCH PAGE MAIN LAYOUT -->
  <div class="watch-container">
    <!-- LEFT / MAIN: VIDEO PLAYER & DETAILS -->
    <main class="watch-main">
      <!-- CUSTOM VIDEO PLAYER CONTAINER -->
      <div class="player-wrapper" id="playerWrapper">
        <video class="player-video" id="mainVideo" preload="metadata"></video>

        <!-- CUSTOM CONTROLS OVERLAY -->
        <div class="player-controls" id="playerControls">
          <!-- PROGRESS / SEEKBAR -->
          <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg">
              <div class="progress-bar-buffer" id="progressBarBuffer"></div>
              <div class="progress-bar-fill" id="progressBarFill"></div>
              <div class="progress-scrubber" id="progressScrubber"></div>
            </div>
            <div class="progress-tooltip" id="progressTooltip">00:00</div>
          </div>

          <!-- CONTROLS ROW -->
          <div class="controls-row">
            <div class="controls-left">
              <!-- Play / Pause -->
              <button class="btn-ctrl" id="playPauseBtn" title="Play/Pause (Space or K)">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              </button>

              <!-- Skip backward 10s -->
              <button class="btn-ctrl" id="skipBackBtn" title="Rewind 10s (Left Arrow)">
                <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
              </button>

              <!-- Skip forward 10s -->
              <button class="btn-ctrl" id="skipForwardBtn" title="Fast forward 10s (Right Arrow)">
                <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
              </button>

              <!-- Volume & Slider -->
              <div class="volume-group">
                <button class="btn-ctrl" id="volumeBtn" title="Mute/Unmute (M)">
                  <svg id="volumeHighIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                  <svg id="volumeMuteIcon" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                </button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
              </div>

              <!-- Time display -->
              <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
            </div>

            <div class="controls-right">
              <!-- Playback speed -->
              <div class="speed-dropdown">
                <button class="btn-ctrl" id="speedBtn" title="Playback Speed">
                  <span id="speedLabel" style="font-size: 0.82rem; font-weight: bold;">1x</span>
                </button>
                <div class="speed-menu" id="speedMenu">
                  <button class="speed-option" data-speed="0.5">0.5x</button>
                  <button class="speed-option" data-speed="0.75">0.75x</button>
                  <button class="speed-option active" data-speed="1">1.0x (Normal)</button>
                  <button class="speed-option" data-speed="1.25">1.25x</button>
                  <button class="speed-option" data-speed="1.5">1.5x</button>
                  <button class="speed-option" data-speed="2">2.0x</button>
                </div>
              </div>

              <!-- Picture-in-Picture -->
              <button class="btn-ctrl" id="pipBtn" title="Picture in Picture">
                <svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 1.98 2 1.98h18c1.1 0 2-.88 2-1.98V5c0-1.1-.9-2-2-2zm0 16.01H3V4.98h18v14.03z"/></svg>
              </button>

              <!-- Fullscreen -->
              <button class="btn-ctrl" id="fullscreenBtn" title="Fullscreen (F)">
                <svg id="fullscreenIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                <svg id="exitFullscreenIcon" viewBox="0 0 24 24" style="display:none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- VIDEO METADATA & ACTIONS -->
      <section class="watch-info">
        <h1 class="watch-title" id="videoTitle">Loading video...</h1>

        <div class="watch-meta-bar">
          <div class="desc-stats" style="margin-bottom: 0;">
            <span id="videoViews">0 views</span>
            <span>•</span>
            <span id="videoDate">Uploaded recently</span>
          </div>

          <div class="actions-group">
            <div class="like-dislike-pill">
              <button class="btn-action" id="likeBtn">
                <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                <span id="likeCount">0</span>
              </button>
              <div class="pill-divider"></div>
              <button class="btn-action" id="dislikeBtn">
                <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
              </button>
            </div>

            <button class="btn-action btn-pill" id="shareBtn">
              <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
              <span>Share</span>
            </button>
          </div>
        </div>

        <!-- DESCRIPTION BOX -->
        <div class="watch-desc-box">
          <div class="desc-text" id="videoDescription">No description provided.</div>
        </div>
      </section>

      <!-- COMMENTS SECTION -->
      <section class="comments-section">
        <h3 class="comments-header" id="commentsCountHeader">Comments (0)</h3>

        <div class="add-comment-box">
          <div class="comment-avatar">You</div>
          <div class="comment-input-area">
            <input type="text" id="commentUserName" class="comment-user-input" placeholder="Your name (optional)">
            <textarea id="commentTextInput" class="comment-textarea" placeholder="Add a comment..."></textarea>
            <div class="comment-buttons">
              <button class="btn-post-comment" id="postCommentBtn">Comment</button>
            </div>
          </div>
        </div>

        <div class="comments-list" id="commentsList">
          <!-- Dynamically inserted comments -->
        </div>
      </section>
    </main>

    <!-- RIGHT: UP NEXT / RECOMMENDATIONS -->
    <aside class="watch-sidebar">
      <div class="sidebar-section">
        <h4>Up Next</h4>
        <div class="sidebar-list" id="sidebarList">
          <!-- Dynamically loaded other videos -->
        </div>
      </div>
    </aside>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/player.js"></script>
  <script src="js/watch.js"></script>
</body>
</html>
